<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>デイリータスク・目標管理</title>
    <meta name="apple-mobile-web-app-title" content="タスク管理">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- iPhone / iPad 用 -->
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">

<!-- Android / PCブラウザ用 -->
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 15px; background-color: #f8f9fa; }
        h1 { color: #333; border-bottom: 3px solid #e67e22; padding-bottom: 8px; margin-bottom: 20px; font-size: 22px; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        
        .month-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 8px 14px; background: #e0e0e0; border: 1px solid #ccc; border-radius: 6px 6px 0 0; text-decoration: none; color: #555; font-weight: bold; font-size: 13px; whitespace: nowrap; }
        .tab-btn.active { background: #e67e22; color: white; border-color: #e67e22; }
        
        .month-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #e67e22; font-weight: bold; color: #d35400; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden; }
        th { background-color: #e67e22; color: white; padding: 8px; text-align: center; font-size: 13px; border: 1px solid #d35400; }
        td { border: 1px solid #e0e0e0; padding: 5px 6px; font-size: 13px; text-align: center; vertical-align: middle; }
        
        tr.sat { background-color: #e8f4fc; }
        tr.sun { background-color: #fde8e8; }
        
        input.cell-input { width: 92%; padding: 5px; border: 1px solid #ddd; border-radius: 3px; font-size: 13px; }
        input.cell-input:focus { border-color: #e67e22; outline: none; background-color: #fffde7; }
        
        /* 備考・メモ用タップ可能入力表示エリア */
        .memo-preview { width: 92%; padding: 5px; border: 1px dashed #bbb; border-radius: 3px; font-size: 12px; background-color: #fafafa; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin: 0 auto; color: #333; }
        .memo-preview:hover { background-color: #fffde7; border-color: #e67e22; }
        .memo-preview.empty { color: #aaa; font-style: italic; }

        select.status-select { padding: 4px 6px; border-radius: 4px; font-weight: bold; font-size: 13px; border: 1px solid #ccc; cursor: pointer; }
        select.status-◎ { background-color: #d4edda; color: #155724; }
        select.status-○ { background-color: #cce5ff; color: #004085; }
        select.status-△ { background-color: #fff3cd; color: #856404; }
        select.status-× { background-color: #f8d7da; color: #721c24; }
        select.status-未 { background-color: #e2e3e5; color: #383d41; }
        
        select.motivation-select { padding: 4px 6px; border-radius: 4px; font-size: 13px; border: 1px solid #ccc; cursor: pointer; }
        
        button.save-btn { background-color: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; }
        button.save-btn:hover { background-color: #2980b9; }

        /* モーダルウィンドウ（画面中央のポップアップ）のスタイル */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-header { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #e67e22; border-bottom: 2px solid #eee; padding-bottom: 6px; }
        .modal-textarea { width: 100%; height: 140px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-btn { padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; border: none; font-weight: bold; }
        .modal-btn-cancel { background: #e0e0e0; color: #333; }
        .modal-btn-save { background: #e67e22; color: white; }
    </style>
</head>
<body>
    <h1>デイリータスク・目標管理シート</h1>
    
    <div class="header-nav">
        <div class="month-tabs">
            {% for m in tab_months %}
            <a href="/?month={{ m }}" class="tab-btn {{ 'active' if m == selected_month else '' }}">
                {{ m.split('-')[0] }}年{{ m.split('-')[1] }}月
            </a>
            {% endfor %}
        </div>
        
        <div>
            <label style="font-size: 12px; font-weight: bold; color: #555;">月を選択: </label>
            <select class="month-select" onchange="location.href='/?month=' + this.value">
                {% for m in months %}
                <option value="{{ m }}" {{ 'selected' if m == selected_month else '' }}>
                    {{ m.split('-')[0] }}年{{ m.split('-')[1] }}月
                </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 75px;">日付</th>
                <th style="width: 35px;">曜日</th>
                <th style="width: 150px;">学習単元・テーマ</th>
                <th>予定（タスク内容）</th>
                <th style="width: 85px;">実績</th>
                <th style="width: 110px;">モチベーション</th>
                <th style="width: 180px;">備考・メモ</th>
                <th style="width: 55px;">保存</th>
            </tr>
        </thead>
        <tbody>
            {% for day in days %}
            <tr class="{{ 'sat' if day.day_of_week == '土' else ('sun' if day.day_of_week == '日' else '') }}">
                <form action="/update" method="POST">
                    <input type="hidden" name="task_date" value="{{ day.task_date }}">
                    <input type="hidden" name="day_of_week" value="{{ day.day_of_week }}">
                    
                    <td><strong>{{ day.task_date[5:] }}</strong></td>
                    <td><strong>{{ day.day_of_week }}</strong></td>
                    <td>
                        <input type="text" name="category" class="cell-input" value="{{ day.category }}" placeholder="単元名">
                    </td>
                    <td>
                        <input type="text" name="planned_task" class="cell-input" value="{{ day.planned_task }}" placeholder="予定を入力...">
                    </td>
                    <td>
                        <select name="status" class="status-select status-{{ day.status }}">
                            <option value="未" {{ 'selected' if day.status == '未' else '' }}>未</option>
                            <option value="◎" {{ 'selected' if day.status == '◎' else '' }}>◎</option>
                            <option value="○" {{ 'selected' if day.status == '○' else '' }}>○</option>
                            <option value="△" {{ 'selected' if day.status == '△' else '' }}>△</option>
                            <option value="×" {{ 'selected' if day.status == '×' else '' }}>×</option>
                        </select>
                    </td>
                    <td>
                        <select name="motivation" class="motivation-select">
                            <option value="-" {{ 'selected' if day.motivation == '-' else '' }}>-</option>
                            <option value="絶好調 👊" {{ 'selected' if day.motivation == '絶好調 👊' else '' }}>絶好調 👊</option>
                            <option value="そこそこ 😆" {{ 'selected' if day.motivation == 'そこそこ 😆' else '' }}>そこそこ 😆</option>
                            <option value="普通 😳" {{ 'selected' if day.motivation == '普通 😳' else '' }}>普通 😳</option>
                            <option value="微妙 😫" {{ 'selected' if day.motivation == '微妙 😫' else '' }}>微妙 😫</option>
                            <option value="限界 💦" {{ 'selected' if day.motivation == '限界 💦' else '' }}>限界 💦</option>
                        </select>
                    </td>
                    <td>
                        <!-- モーダル起動用のプレビュー枠（タップすると大きく開く） -->
                        <div class="memo-preview {{ 'empty' if not day.memo else '' }}" 
                             id="preview-{{ day.task_date }}" 
                             onclick="openMemoModal('{{ day.task_date }}')">
                            {{ day.memo if day.memo else 'タップして入力...' }}
                        </div>
                        <!-- 実際にフォーム送信される隠しフィールド -->
                        <input type="hidden" name="memo" id="memo-input-{{ day.task_date }}" value="{{ day.memo }}">
                    </td>
                    <td>
                        <button type="submit" class="save-btn">保存</button>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- モーダルウィンドウ構造 -->
    <div class="modal-overlay" id="memoModal">
        <div class="modal-content">
            <div class="modal-header" id="modalDateHeader">メモを編集</div>
            <textarea class="modal-textarea" id="modalTextarea" placeholder="メモを入力してください..."></textarea>
            <div class="modal-actions">
                <button type="button" class="modal-btn modal-btn-cancel" onclick="closeMemoModal()">キャンセル</button>
                <button type="button" class="modal-btn modal-btn-save" onclick="applyMemoModal()">確定</button>
            </div>
        </div>
    </div>

    <script>
        let currentTargetDate = null;

        // モーダルを開く関数
        function openMemoModal(dateStr) {
            currentTargetDate = dateStr;
            const hiddenInput = document.getElementById('memo-input-' + dateStr);
            const textarea = document.getElementById('modalTextarea');
            const header = document.getElementById('modalDateHeader');
            
            header.innerText = dateStr + ' の備考・メモ';
            textarea.value = hiddenInput.value;
            
            const modal = document.getElementById('memoModal');
            modal.style.display = 'flex';
            textarea.focus();
        }

        // モーダルを閉じる関数
        function closeMemoModal() {
            document.getElementById('memoModal').style.display = 'none';
            currentTargetDate = null;
        }

        // 確定ボタンを押して表側に反映する関数
        function applyMemoModal() {
            if (!currentTargetDate) return;
            
            const textareaValue = document.getElementById('modalTextarea').value;
            const hiddenInput = document.getElementById('memo-input-' + currentTargetDate);
            const previewDiv = document.getElementById('preview-' + currentTargetDate);
            
            hiddenInput.value = textareaValue;
            
            if (textareaValue.trim() === '') {
                previewDiv.innerText = 'タップして入力...';
                previewDiv.classList.add('empty');
            } else {
                previewDiv.innerText = textareaValue;
                previewDiv.classList.remove('empty');
            }
            
            closeMemoModal();
        }
    </script>
</body>
</html>
